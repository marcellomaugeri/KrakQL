type Query {
  findByEmail(email: String!): User
  findById(id: String!): User
  getAllCategories: Category
  getAllProducts: Product
  getAllStores: Store
  findStoreById(id: String!): Store
  getAllAttributes: Attribute
}

type Mutation {
  createUser(data: CreateUserDtoInput!): User
  createStore(data: CreateStoreDtoInput!): Store
  login: AuthType
  createCategory(data: CreateCategoryDtoInput!): Category
  createProduct(data: CreateProductDtoInput!): Product
  linkCategoryToProduct: Product
  linkProductsToStore: Store
  linkEmployeesToStore: Store
  linkAttributeToProduct: Product
  createAttribute(data: CreateAttributeDtoInput!): Attribute
}

type User {
  role: Roles!
  store: Store
  username: String!
  updatedAt: DateTime!
  bio: String!
  createdAt: DateTime!
  name: String!
  email: String!
  id: ID!
  status: Status!
  image: String!
  __typename: String!
}

type Store {
  zipCode: String!
  city: String!
  updatedAt: DateTime!
  rate: Float!
  bio: String!
  sales: Float!
  employees: User
  createdAt: DateTime!
  products: Product
  name: String!
  state: String!
  id: ID!
  country: String!
  street: String!
  slug: String!
  neighborhood: String!
  number: String!
  __typename: String!
}

type AuthType {
  user: User
  token: String!
  __typename: String!
}

type Category {
  products: Product
  description: String!
  name: String!
  id: ID!
  __typename: String!
}

type Product {
  store: Store
  price: Float!
  updatedAt: DateTime!
  description: String!
  sku: String!
  createdAt: DateTime!
  images: String!
  attributes: Attribute
  categories: Category
  reviews: Float!
  id: ID!
  thumbnail: String!
  dimension: String!
  brand: String!
  title: String!
  quantity: Float!
  __typename: String!
}

type Roles {
  dummy: String
}

type DateTime {
  dummy: String
}

type Status {
  dummy: String
}

type Attribute {
  value: String!
  name: String!
  id: ID!
  product: Product
  type: Types!
  __typename: String!
}

type Types {
  dummy: String
}

input CreateUserDtoInput

input CreateStoreDtoInput

input CreateCategoryDtoInput

input CreateProductDtoInput

input CreateAttributeDtoInput