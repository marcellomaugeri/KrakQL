  totalPages: Int!
  hasNextPage: Boolean!
  hasPrevPage: Boolean!
  docs: FormSubmission
  offset: Int
  pagingCounter: Int!
  nextPage: Int
  limit: Int!
  prevPage: Int
}

type Searches {
  hasNextPage: Boolean!
  page: Int!
  totalDocs: Int!
  totalPages: Int!
  hasPrevPage: Boolean!
  docs: Search
  offset: Int
  pagingCounter: Int!
  nextPage: Int
  limit: Int!
  prevPage: Int
}

type countSearches {
  totalDocs: Int
}

type FormSubmission {
  id: String!
