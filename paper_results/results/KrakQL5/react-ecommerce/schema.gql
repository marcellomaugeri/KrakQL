type Query {
  getAllCategories: Category
  getAllProducts: Product
  findStoreById(id: String!): Store
  getAllStores: Store
  findById(id: String!): User
  findByEmail(email: String!): User
  getAllAttributes: Attribute
}

type Mutation {
  createUser(data: CreateUserDtoInput!): User
  createStore(data: CreateStoreDtoInput!): Store
  linkProductsToStore(data: LinkProductToStoreDtoInput!): Store
  linkAttributeToProduct(data: LinkAttributeToProductDtoInput!): Product
  createProduct(data: CreateProductDtoInput!): Product
  createCategory(data: CreateCategoryDtoInput!): Category
  linkCategoryToProduct(data: LinkCategoryToProductDtoInput!): Product
  linkEmployeesToStore(data: LinkEmployeeToStoreDtoInput!): Store
  createAttribute(data: CreateAttributeDtoInput!): Attribute
}

